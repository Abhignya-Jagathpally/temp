[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "resistancemap"
version = "0.1.0"
description = "Pharmacogenomic machine learning for drug resistance prediction in hematologic malignancies"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ResistanceMap Contributors", email = "contact@resistancemap.org"}
]
keywords = ["drug-resistance", "machine-learning", "hematology", "pharmacogenomics", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.11"

# Core dependencies — pinned to compatible ranges (Agent 7 §7.3)
dependencies = [
    "torch>=2.1.0,<2.6",
    "torch-geometric>=2.4.0,<2.7",
    "transformers>=4.35.0,<4.50",
    "accelerate>=0.25.0,<0.40",
    "numpy>=1.24.0,<2.0",
    "scipy>=1.11.0,<1.15",
    "pandas>=2.0.0,<2.3",
    "scikit-learn>=1.3.0,<1.6",
    "pyyaml>=6.0,<7.0",
    "tqdm>=4.66.0,<5.0",
    "tensorboard>=2.14.0,<2.18",
    "wandb>=0.16.0,<0.20",
    "fastapi>=0.104.0,<0.120",
    "uvicorn[standard]>=0.24.0,<0.35",
    "pydantic>=2.0.0,<2.10",
    "h5py>=3.10.0,<3.13",
    "scanpy>=1.9.5,<1.11",
    "anndata>=0.9.2,<0.12",
    "biopython>=1.81,<1.85",
    "networkx>=3.2,<3.5",
    "umap-learn>=0.5.5,<0.6",
    "matplotlib>=3.8.0,<3.10",
    "seaborn>=0.13.0,<0.14",
    "plotly>=5.17.0,<5.25",
    "torchdiffeq>=0.2.3,<0.3",
    "xgboost>=2.0.0",
    "gseapy>=1.0.0",
    "adjustText>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "ipython>=8.17.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
]

gpu = [
    "torch[cuda12]>=2.1.0",
]

cpu = [
    "torch>=2.1.0",
]

agentic = [
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
]

baselines = ["mofapy2>=0.7.0", "cellrank>=2.0.0", "scvi-tools>=1.0.0"]
interpretability = ["gseapy>=1.0.0"]
tracking = ["wandb>=0.15.0", "tensorboard>=2.14.0"]
all = ["mofapy2>=0.7.0", "cellrank>=2.0.0", "scvi-tools>=1.0.0", "gseapy>=1.0.0", "wandb>=0.15.0", "tensorboard>=2.14.0", "xgboost>=2.0.0"]

[project.urls]
Homepage = "https://github.com/resistancemap/resistancemap"
Documentation = "https://resistancemap.readthedocs.io"
Repository = "https://github.com/resistancemap/resistancemap"
"Bug Tracker" = "https://github.com/resistancemap/resistancemap/issues"

[project.scripts]
resistancemap = "resistancemap.main:main"

[tool.setuptools]
packages = ["resistancemap", "resistancemap.agents", "resistancemap.agentops", "resistancemap.data", "resistancemap.data_quality", "resistancemap.evaluation", "resistancemap.evaluation.metrics", "resistancemap.evaluation.baselines", "resistancemap.evaluation.tier_a", "resistancemap.evaluation.tier_b", "resistancemap.evaluation.tier_c", "resistancemap.evaluation.tier_d", "resistancemap.inference", "resistancemap.landscape", "resistancemap.latent_compute", "resistancemap.mcp_integration", "resistancemap.models", "resistancemap.utils", "resistancemap.verification"]

[tool.setuptools.package-data]
resistancemap = [
    "config/*.yaml",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=resistancemap --cov-report=term-missing"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
    "gpu: requires GPU",
]

[tool.coverage.run]
source = ["resistancemap"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
