# MORT-FM acceptance / claim gates.
# Read by resistancemap.governance.claim_gates.run_gates() before every RUNS.md row.

gate_static_drug_response:
  min_models: 300
  min_drugs: 50
  min_observed_response_rows: 10000
  min_model_mapping_rate: 0.8

gate_pathway_mechanism:
  min_gene_to_uniprot_coverage: 0.7
  min_drug_to_target_coverage: 0.5
  min_pathway_mapping_coverage: 0.5
  require_reactome: true
  require_drug_target_edges: true

gate_survival_claim:
  min_patients: 200
  min_events: 50
  require_c_index: true
  require_patient_disjoint_split: true
  require_endpoint_name: true

gate_trajectory_claim:
  min_longitudinal_pairs: 100
  min_unique_patients_with_2_timepoints: 50
  require_real_time_units: true
  forbid_pseudotime_as_calendar_time: true

gate_resistance_claim:
  forbid_endpoint_only_overall_survival: true
  allowed_endpoints:
    - progression_free_survival
    - relapse_time
    - refractory_status
    - mrd_conversion
    - drug_resistance_label
    - ex_vivo_resistance_shift

gate_sequence_aware_claim:
  require_uniprot_fasta: true
  min_string_protein_coverage: 0.7
  min_feature_gene_coverage: 0.7
  require_embedding_cache: true

# ---------------------------------------------------------------------------
# Block B/C/D data-readiness gates. These guard the *inputs* to MORT-FM
# Block-E integration, not the model claims themselves. The corresponding
# claim gates above guard outputs.
# ---------------------------------------------------------------------------

gate_beataml_specimen_drug_response:
  # Used by scripts/mortfm_validate_beataml.py.
  min_specimens_with_expression: 300
  min_specimens_with_drug_response: 100
  min_drugs: 20
  require_specimen_disjoint_split: true

gate_single_cell_state_pretraining:
  # Used by scripts/mortfm_build_scrna_manifest.py (acceptance is read at
  # Block-C runtime; here we record the spec thresholds for documentation).
  min_total_cells: 50000
  min_unique_samples: 10
  require_counts_layer: true
  # Pseudotime-only datasets cannot be used for trajectory claims (see
  # gate_trajectory_claim).
  pseudotime_only_block_trajectory_claim: true

gate_pathway_context:
  # Read by scripts/mortfm_harmonize_identifiers.py — pure mapping coverage,
  # separated from the (claim-level) gate_pathway_mechanism above.
  min_feature_gene_to_uniprot_coverage: 0.70

gate_drug_target_mechanism:
  # Read by scripts/mortfm_resolve_drug_names.py. Realistic threshold based on
  # the public ChEMBL drug-targets export; the spec-level 0.50 target is also
  # recorded in the report for honesty.
  min_per_source_drug_coverage: 0.30
  spec_target_drug_coverage: 0.50

gate_sequence_aware:
  # Read by scripts/mortfm_compute_esm2_embeddings.py. Mirrors
  # gate_sequence_aware_claim but adds the embedding-cache population check.
  require_uniprot_fasta: true
  require_esm_embedding_cache: true
  min_n_embeddings: 100
  min_feature_gene_coverage_via_identifier_map: 0.70
