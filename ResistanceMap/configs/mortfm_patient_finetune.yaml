# MORT-FM Stage D/F config: patient-domain adaptation + survival finetune.
# Initialised from a cellline-pretrain checkpoint (see configs/mortfm_cellline_pretrain.yaml).
# Trains on MMRF + Beat-AML patient outcomes.

model_name: MORT-FM
version: v15.0-patient-finetune

use_rna: true
use_atac: false
use_methylation: false
use_histone_ptm: true        # turn on if histone PTM modality is wired
use_proteomics: true
use_phosphoproteomics: false
use_clinical: true
use_drug: true

rna_input_dim: 5000
proteomics_input_dim: 8000
histone_ptm_input_dim: 6
clinical_input_dim: 32
drug_n_drugs: 32
drug_n_classes: 16
drug_embed_dim: 64

d_latent: 128
d_token: 64
fusion_layers: 4
fusion_heads: 4
fusion_dropout: 0.1

dynamics_kind: neural_ode
integration_time: 1.0
n_time_grid: 4
use_graph_conditioning: true
use_potential: false

survival_kind: discrete
survival_n_bins: 12

lambda_recon: 0.5
lambda_masked: 0.5
lambda_contrastive: 0.3
lambda_drug: 1.0
lambda_trajectory: 0.0
lambda_survival: 2.0      # primary signal at this stage
lambda_state: 1.0
lambda_pathway: 0.3
lambda_perturbation: 0.0
lambda_landscape: 0.0
lambda_counterfactual: 0.0
lambda_calibration: 0.5

batch_size: 32
pretrain_epochs: 0
finetune_epochs: 50
trajectory_epochs: 0
survival_epochs: 50
lr: 1.0e-4
weight_decay: 1.0e-5
mixed_precision: true
grad_clip: 1.0
modality_dropout_p: 0.10
seed: 42

checkpoint_dir: checkpoints/mortfm/patient_finetune
log_dir: logs/mortfm/patient_finetune

min_paired_n_for_longitudinal_claim: 100
min_patient_n_for_survival_claim: 200
